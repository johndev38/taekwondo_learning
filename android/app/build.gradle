plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties") // Initialisation de la variable

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    throw new GradleException("Fichier key.properties introuvable. Veuillez créer le fichier dans le dossier android/ avec les bonnes configurations.")
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.johndev38.taekwondo_knowledge"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.johndev38.taekwondo_knowledge"
        minSdk = 21  // Requis pour youtube_player_flutter
        targetSdk = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true
        
        // Activer les symboles de débogage natifs
        ndk {
            debugSymbolLevel 'FULL'
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            // Symboles de débogage sans minification (pour éviter les problèmes ProGuard)
            // Réactivez minifyEnabled true pour plus d'optimisation une fois le Mode Dev activé
            minifyEnabled false
            shrinkResources false
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    // Split APK par architecture pour réduire la taille de téléchargement
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Les splits d'app bundle fonctionnent automatiquement sans Play Core
    // Play Core n'est nécessaire que pour les fonctionnalités avancées (deferred components, etc.)

    // Requis pour enableEdgeToEdge() (affichage bord à bord Android 15 / SDK 35)
    implementation "androidx.activity:activity-ktx:1.9.3"
}
